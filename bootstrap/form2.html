<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="p-5 bg-light">

    <div class="container bg-white p-4 shadow-sm rounded-0">
        <form class="row g-2">
            <!-- Linha 1 -->
            <div class="col-md-1 mb-2">
                <label class="form-label fw-bold mb-1">Código</label>
                <input type="text" class="form-control rounded-0 w-50" value="32" disabled>
            </div>
            <div class="col-md-5 mb-2">
                <label class="form-label fw-bold mb-1">Nome</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Nome Completo do Cliente">
            </div>
            <div class="col-md-4 mb-2">
                <label class="form-label fw-bold mb-1">E-mail</label>
                <input type="email" class="form-control rounded-0 w-75" placeholder="cliente@dominio.com">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">CPF</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Só números">
            </div>

            <!-- Linha 2 -->
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Nº Celular</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Nº do celular">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Nº Telefone fixo</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Nº telefone">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">CEP</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="ex:88308070">
            </div>
            <div class="col-md-3 mb-2">
                <label class="form-label fw-bold mb-1">Logradouro</label>
                <input type="text" class="form-control rounded-0 w-50" placeholder="ex:Rua 1400,">
            </div>
            <div class="col-md-1 mb-2">
                <label class="form-label fw-bold mb-1">Nº</label>
                <input type="text" class="form-control rounded-0 w-50" placeholder="Nº">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Bairro</label>
                <input type="text" class="form-control rounded-0" placeholder="Bairro">
            </div>

            <!-- Linha 3 -->
            <div class="col-md-4 mb-2">
                <label class="form-label fw-bold mb-1">Cidade</label>
                <input type="text" class="form-control rounded-0 w-75" placeholder="Cidade">
            </div>
            <div class="col-md-1 mb-2">
                <label class="form-label fw-bold mb-1">UF</label>
                <input type="text" class="form-control rounded-0 w-50" placeholder="UF">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label fw-bold mb-1">Status</label>
                <select class="form-select rounded-0 w-75">
                    <option selected>Selecione</option>
                </select>
            </div>

            <!-- Botões -->
            <div class="col-12 text-end mt-4">
                <button type="reset" class="btn btn-danger rounded-0" >Resetar</button>
                <button type="submit" class="btn btn-success rounded-0">Próximo</button>
            </div>
        </form>
    </div>

</body>
</html>
