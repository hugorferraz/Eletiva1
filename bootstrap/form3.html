<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="p-5 bg-light">

    <div class="container bg-white p-5 shadow-sm" style="max-width: 900px;">
        
        <h2 class="text-center mb-4 fw-normal text-secondary">Sample Form</h2>

        <form>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Partner Name</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Partner Email ID</label>
                </div>
                <div class="col-md-4">
                    <input type="email" class="form-control">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Partner Legal Name</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Partner Mobile</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Partner Address</label>
                </div>
                <div class="col-md-10">
                    <textarea class="form-control" rows="3"></textarea>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Contract Start Date</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control text-muted" placeholder="Date Start">
                </div>
                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Contract Expiry Date</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control text-muted" placeholder="Date End">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Minimum Loan Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Maximum Loan Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Interest Rate</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-2 text-md-end">
                    <label class="form-label fw-bold mb-0" style="font-size: 0.9rem;">Deposit Amount</label>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Save</button>
            </div>
        </form>

    </div>

</body>
</html>
