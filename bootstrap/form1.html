<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="p-4 bg-light">

    <div class="container">
        <div class="card p-3 shadow-sm">
            <div class="card-body">
                
                <form class="row g-2">
                    <div class="col-md-4">
                        <label for="firstName" class="form-label mb-1">First name</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Mark" required>
                    </div>
                    <div class="col-md-4">
                        <label for="lastName" class="form-label mb-1">Last name</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Otto" required>
                    </div>
                    <div class="col-md-4">
                        <label for="userName" class="form-label mb-1">Username</label>
                        <div class="input-group">
                            <span class="input-group-text" id="inputGroupPrepend2">@</span>
                            <input type="text" class="form-control" id="userName" aria-describedby="inputGroupPrepend2" placeholder="Username" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="city" class="form-label mb-1">City</label>
                        <input type="text" class="form-control" id="city" placeholder="City" required>
                    </div>
                    <div class="col-md-3">
                        <label for="state" class="form-label mb-1">State</label>
                        <input type="text" class="form-control" id="state" placeholder="State" required>
                    </div>
                    <div class="col-md-3">
                        <label for="zip" class="form-label mb-1">Zip</label>
                        <input type="text" class="form-control" id="zip" placeholder="Zip" required>
                    </div>
                    <div class="col-12 mt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="invalidTerms" required>
                            <label class="form-check-label" for="invalidTerms">
                                Agree to terms and conditions
                            </label>
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <button class="btn btn-primary" type="submit">Submit form</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
