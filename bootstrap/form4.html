<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="p-5 bg-light">

    <div class="container bg-white p-5 shadow-sm rounded-0" style="max-width: 1000px;">
        
        <h2 class="mb-4 fw-normal">Novo Usuário</h2>

        <form class="row g-3">
            
            <div class="col-12">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">Nome:</label>
                <input type="text" class="form-control rounded-0" placeholder="Informe o nome...">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">CPF:</label>
                <input type="text" class="form-control rounded-0" placeholder="Informe o cpf...">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">Endereço:</label>
                <input type="text" class="form-control rounded-0" placeholder="Informe o endereço...">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">Nível:</label>
                <select class="form-select rounded-0">
                    <option selected>---</option>
                    <option value="1">Administrador</option>
                    <option value="2">Comum</option>
                </select>
            </div>

            <div class="col-md-5">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">Email:</label>
                <input type="email" class="form-control rounded-0" placeholder="Informe o email...">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">Senha:</label>
                <input type="password" class="form-control rounded-0" placeholder="Informe a senha...">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold mb-1" style="font-size: 0.9rem;">Status:</label>
                <select class="form-select rounded-0">
                    <option selected>---</option>
                    <option value="1">Ativo</option>
                    <option value="2">Inativo</option>
                </select>
            </div>

            <div class="col-12 text-end mt-4">
                <button type="submit" class="btn btn-success rounded-0 px-4">Enviar</button>
                <button type="button" class="btn btn-light border rounded-0 px-4">Cancelar</button>
            </div>

        </form>
    </div>

</body>
</html>
